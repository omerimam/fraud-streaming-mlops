name: Fraud Project CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17 for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FastAPI dependencies
        working-directory: fastapi_service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-fastapi.txt

      - name: Validate Python syntax
        run: |
          python -m compileall fastapi_service/app
          python -m compileall streamlit_app

      - name: Run FastAPI unit tests
        working-directory: fastapi_service
        run: |
          pytest -v

  docker-validation:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate app Compose file
        run: |
          docker compose -f docker-compose.app.yml config

      - name: Validate full Compose file
        run: |
          docker compose -f docker-compose.full.yml config

      - name: Build FastAPI Docker image
        run: |
          docker build -t fraud-fastapi:ci ./fastapi_service

      - name: Build Streamlit Docker image
        run: |
          docker build -t fraud-streamlit:ci ./streamlit_app
